server {
  listen 80;
  location /api/ { proxy_pass http://app:8080; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Request-Id $request_id; }
  location /actuator/ { proxy_pass http://app:8080; }
  location / { return 200 'meeting-checkin gateway'; add_header Content-Type text/plain; }
}
